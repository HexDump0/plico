[package]
name = "plico-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flate2 = "1"
jpeg-encoder = "0.7"
js-sys = "0.3"
lopdf = { version = "0.44.0", default-features = false, features = ["wasm_js"] }
png = "0.18"
wasm-bindgen = "0.2"
zune-core = "0.5"
zune-jpeg = "0.5"
